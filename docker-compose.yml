services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: swiftlink
      POSTGRES_USER: swiftuser
      POSTGRES_PASSWORD: swiftpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiftuser -d swiftlink"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    ports:
      - "3000:3000"
    env_file: ./api/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  k6:
    image: grafana/k6
    volumes:
      - ./loadtest.js:/loadtest.js
    command: run /loadtest.js
    depends_on:
      - api

volumes:
  postgres_data: